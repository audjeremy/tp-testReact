name: React tests

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  cypress-component:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run unit tests (Vitest)
        run: |
          # Lance les tests unitaires Vitest
          npm test

      - name: Run Cypress component tests
        run: |
          # Lance les tests Cypress Component
          npm run ct:run

      - name: Run Cypress e2e tests
        run: |
          # Lance les tests Cypress E2E
          npm run e2e:run
