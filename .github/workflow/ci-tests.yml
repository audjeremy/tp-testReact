name: React tests

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  cypress-component:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress component tests
        run: npx cypress run --component